name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check formatting with Black
        run: black --check .

      - name: Lint with flake8
        run: flake8 . --max-line-length=100 --extend-ignore=E203

      - name: Run tests
        run: |
          pytest test_traceability_engine.py -v
          pytest test_requirements.py -v

      - name: Scan dependencies for known vulnerabilities (ISO/SAE 21434-style continuous scanning)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Scan source code for security issues with Bandit
        run: |
          pip install bandit
          bandit -r . --exclude ./__pycache__,./test_requirements.py,./test_traceability_engine.py